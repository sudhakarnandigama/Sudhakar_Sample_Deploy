# ---- SQLite datasource ----
spring.datasource.url=jdbc:sqlite:bookstore.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Auth ----
# API key required to call stock mutation endpoints (PUT /api/books/{id}/stock,
# PATCH /api/books/{id}/stock/adjust). Override with the BOOKSTORE_API_KEY env var.
# Empty = fail closed: unauthenticated stock mutations are rejected with 401.
bookstore.api-key=

# ---- Server ----
server.port=8080
